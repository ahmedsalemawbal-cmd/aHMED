# إعدادات Supabase المحلّية — تُقرأ بـ `supabase start`
project_id = "osool"

[db]
port = 54322
major_version = 17

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600

# الحسابات تُنشئها المدرسة ولا يسجّل أحدٌ نفسه: تسجيلٌ مفتوح على نظام
# مدرسة يعني أن أي شخص على الإنترنت يصنع حسابًا داخل بيانات أطفال.
enable_signup = false

[studio]
port = 54323
