name: بناء ونشر تطبيق البريد

# يعمل تلقائيًا مع كل دفعة إلى فرع التطبيق، أو يدويًا من تبويب Actions.
on:
  push:
    branches: ['claude/windows-email-app-0r6kaj']
    paths:
      - 'osoul-mail-desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: osoul-mail-desktop

jobs:
  build:
    name: بناء ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # مثبّت ويندوز — يُبنى على ويندوز فلا يحتاج Wine
          - os: windows-latest
            label: Windows
            command: npm run dist
            artifacts: osoul-mail-desktop/dist/*.exe
          # ملف ماك واحد (universal) يعمل على Intel و Apple Silicon معًا،
          # ودمج المعماريتين يحتاج أدوات macOS فيُبنى على macOS
          - os: macos-latest
            label: macOS
            command: npm run dist:mac
            artifacts: osoul-mail-desktop/dist/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: osoul-mail-desktop/package-lock.json

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: الاختبارات (لينكس/ماك فقط — تحتاج شاشة وهمية على ويندوز)
        if: matrix.os == 'macos-latest'
        run: npm run test:sign && npm run test:imap && npm run test:smtp

      - name: البناء
        run: ${{ matrix.command }}
        env:
          # لا شهادة Apple Developer: نمنع البحث عنها، والتوقيع المحلي
          # (ad-hoc) يتم في build/after-pack.js لأن أجهزة Apple Silicon
          # ترفض تشغيل ثنائي arm64 بلا أي توقيع.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # توقيع ويندوز: يعمل وحده متى وُضعت الشهادة في أسرار المستودع،
          # ويبقى البناء ناجحًا بدونها. electron-builder يقرأ هذين
          # المتغيّرين تلقائيًا ويتخطّى التوقيع إن كانا فارغين.
          #
          # ويندوز 11 فيه "التحكم الذكي في التطبيقات" (Smart App Control)
          # يحظر كل ملف غير موقّع بلا زر تجاوز — فالتوقيع ليس تحسينًا
          # تجميليًا بل شرط تشغيل على أجهزة كثيرة.
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WINDOWS_CERT_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WINDOWS_CERT_PASSWORD || '' }}
          # البديل الأرخص: خدمة التوقيع من Microsoft بدل شهادة على رمز صلب.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

      # التوقيع يفشل صامتًا حين تنتهي الشهادة أو يُخطئ أحد في السرّ، فيخرج
      # مثبّت يحظره ويندوز — وهو ما لا يُكتشف إلا عند موظف يحاول التثبيت.
      - name: التحقق من توقيع مثبّت ويندوز
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: osoul-mail-desktop
        run: |
          $exe = (Get-ChildItem dist/*.exe | Select-Object -First 1).FullName
          $sig = Get-AuthenticodeSignature $exe
          Write-Host "التوقيع: $($sig.Status) — $($sig.SignerCertificate.Subject)"
          if ('${{ secrets.WINDOWS_CERT_BASE64 }}' -eq '' -and '${{ secrets.AZURE_CLIENT_ID }}' -eq '') {
            Write-Host "::warning::لا توجد شهادة توقيع. ويندوز 11 سيحظر المثبّت عبر Smart App Control."
          } elseif ($sig.Status -ne 'Valid') {
            Write-Error "الشهادة مضبوطة لكن التوقيع غير صالح ($($sig.Status)). المثبّت سيُحظر."
            exit 1
          }

      # نسخة ماك بلا توقيع لا تعمل على Apple Silicon إطلاقًا، وهذا العطل
      # لا يظهر إلا على جهاز المستخدم — فنفشل هنا بدل أن ننشره.
      - name: التحقق من توقيع حزمة ماك
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find dist -maxdepth 2 -name "*.app" | head -1)
          test -n "$APP" || { echo "لم أجد حزمة .app"; exit 1; }
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc" \
            || { echo "الحزمة غير موقّعة — إيقاف النشر"; exit 1; }
          echo "التوقيع المحلي سليم: $APP"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: نشر الإصدار
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: عرض ما سيُنشر
        working-directory: .
        run: ls -lh artifacts

      - name: إنشاء الإصدار ورفع الملفات
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # الوسم من رقم نسخة التطبيق، فيبقى رابط التنزيل مقروءًا ومتوقعًا.
          TAG="v$(node -p "require('./osoul-mail-desktop/package.json').version")"
          REPO="${{ github.repository }}"

          # عطل في واجهة GitHub قد يترك إصدارًا نصف مُنشأ: مسودة بلا وسم،
          # ملفاتها مرفوعة لكن روابطها لا تعمل ولا تظهر لأحد. ننظّفها أولًا
          # وإلا تراكمت مسودات ميتة وبقي الرابط الذي ينتظره الموظفون معطّلًا.
          gh api "repos/$REPO/releases" --paginate \
            --jq '.[] | select(.draft and (.tag_name | startswith("untagged"))) | .id' \
            | while read -r id; do
                [ -n "$id" ] && gh api -X DELETE "repos/$REPO/releases/$id" || true
              done

          # إعادة تشغيل البناء لنفس النسخة تستبدل الملفات بدل أن تفشل.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber artifacts/*
            gh release edit "$TAG" --repo "$REPO" --draft=false
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "بريد أصول البناء $TAG" \
            --notes "$(cat <<'EOF'
          تطبيق بريد الموظفين — نزّل الملف المناسب لجهازك وشغّله.

          ### ويندوز
          `OsoulMail-Setup-*.exe` — شغّله ويثبّت نفسه ويفتح مباشرة.

          ### ماك
          `OsoulMail-Mac-*.dmg` — ملف واحد يعمل على أجهزة Intel و Apple Silicon.
          افتحه واسحب التطبيق إلى Applications.

          **أول تشغيل على الماك:** كليك يمين على التطبيق ← Open ← Open.
          هذه الخطوة لمرة واحدة فقط، لأن التطبيق غير موقّع بشهادة Apple.

          يتطلب macOS 10.15 (Catalina) فأحدث.
          EOF
          )" \
            artifacts/*

          # الإصدار قد يُنشأ مسودةً رغم نجاح الأمر. لا ينفع الوثوق بالنجاح
          # وحده: الموظف يحتاج رابطًا يعمل، فنتحقق منه قبل إنهاء البناء.
          gh release edit "$TAG" --repo "$REPO" --draft=false || true

          URL="https://github.com/$REPO/releases/download/$TAG/OsoulMail-Setup-${TAG#v}.exe"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -L "$URL")
            [ "$CODE" = "200" ] && { echo "رابط التنزيل يعمل: $URL"; exit 0; }
            sleep 10
          done
          echo "::error::الإصدار $TAG نُشر لكن رابط التنزيل لا يعمل (HTTP $CODE)"
          exit 1
