name: بناء ونشر تطبيق البريد

# يعمل تلقائيًا مع كل دفعة إلى فرع التطبيق، أو يدويًا من تبويب Actions.
on:
  push:
    branches: ['claude/windows-email-app-0r6kaj']
    paths:
      - 'osoul-mail-desktop/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: osoul-mail-desktop

jobs:
  build:
    name: بناء ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # مثبّت ويندوز — يُبنى على ويندوز فلا يحتاج Wine
          - os: windows-latest
            label: Windows
            command: npm run dist
            artifacts: osoul-mail-desktop/dist/*.exe
          # ملف ماك واحد (universal) يعمل على Intel و Apple Silicon معًا،
          # ودمج المعماريتين يحتاج أدوات macOS فيُبنى على macOS
          - os: macos-latest
            label: macOS
            command: npm run dist:mac
            artifacts: osoul-mail-desktop/dist/*.dmg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: osoul-mail-desktop/package-lock.json

      - name: تثبيت الاعتماديات
        run: npm ci

      - name: الاختبارات (لينكس/ماك فقط — تحتاج شاشة وهمية على ويندوز)
        if: matrix.os == 'macos-latest'
        run: npm run test:sign && npm run test:imap && npm run test:smtp

      - name: البناء
        run: ${{ matrix.command }}
        env:
          # لا شهادة Apple Developer: نمنع البحث عنها، والتوقيع المحلي
          # (ad-hoc) يتم في build/after-pack.js لأن أجهزة Apple Silicon
          # ترفض تشغيل ثنائي arm64 بلا أي توقيع.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # نسخة ماك بلا توقيع لا تعمل على Apple Silicon إطلاقًا، وهذا العطل
      # لا يظهر إلا على جهاز المستخدم — فنفشل هنا بدل أن ننشره.
      - name: التحقق من توقيع حزمة ماك
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find dist -maxdepth 2 -name "*.app" | head -1)
          test -n "$APP" || { echo "لم أجد حزمة .app"; exit 1; }
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -q "Signature=adhoc" \
            || { echo "الحزمة غير موقّعة — إيقاف النشر"; exit 1; }
          echo "التوقيع المحلي سليم: $APP"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: نشر الإصدار
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: عرض ما سيُنشر
        working-directory: .
        run: ls -lh artifacts

      - name: إنشاء الإصدار ورفع الملفات
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # الوسم من رقم نسخة التطبيق، فيبقى رابط التنزيل مقروءًا ومتوقعًا.
          TAG="v$(node -p "require('./osoul-mail-desktop/package.json').version")"
          # إعادة تشغيل البناء لنفس النسخة تستبدل الملفات بدل أن تفشل.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber artifacts/*
            exit 0
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "بريد أصول البناء $TAG" \
            --notes "$(cat <<'EOF'
          تطبيق بريد الموظفين — نزّل الملف المناسب لجهازك وشغّله.

          ### ويندوز
          `OsoulMail-Setup-*.exe` — شغّله ويثبّت نفسه ويفتح مباشرة.

          ### ماك
          `OsoulMail-Mac-*.dmg` — ملف واحد يعمل على أجهزة Intel و Apple Silicon.
          افتحه واسحب التطبيق إلى Applications.

          **أول تشغيل على الماك:** كليك يمين على التطبيق ← Open ← Open.
          هذه الخطوة لمرة واحدة فقط، لأن التطبيق غير موقّع بشهادة Apple.

          يتطلب macOS 10.15 (Catalina) فأحدث.
          EOF
          )" \
            artifacts/*
