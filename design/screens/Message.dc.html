<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الرسالة</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/maidani/tokens.css">
<link rel="stylesheet" href="ds/maidani/components/bundle.css">
<script src="ds/maidani/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans); direction: rtl;">

<header style="display: flex; align-items: center; gap: 4px; padding: 16px 16px 12px; background: var(--surface-raised); border-bottom: 1px solid var(--line);">
<a href="NewLead4.dc.html" aria-label="رجوع" style="width: 48px; height: 48px; display: grid; place-items: center; color: var(--ink); margin-inline-start: -12px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0;">
<h1 style="margin: 0; font-size: 17px; line-height: 26px; font-weight: 700;">مطعم ريدان</h1>
<span style="font-size: 14px; line-height: 20px; color: var(--ink-muted);">أ. خالد العتيبي · مالك · <span dir="ltr">055 123 4567</span></span>
</div>
<x-import component-from-global-scope="Maidani.StageBadge" stage="visited" size="sm"></x-import>
</header>

<main style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 16px;">
<div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: var(--surface-sunken); border-radius: 10px; font-size: 14px; line-height: 22px; color: var(--ink-muted);">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px;"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3zM19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8L19 15z"></path></svg>
<span>مسودة مبنية على ملاحظتك: <b style="color: var(--ink);">أطباق ممتازة وحساب بدون فيديو</b>، ونقطتي الضعف: الفيديو، والرد على المراجعات.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<span style="font-size: 15px; line-height: 22px; font-weight: 700;">النبرة</span>
<div role="radiogroup" aria-label="النبرة" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--surface-sunken); border: 1.5px solid var(--line-strong); border-radius: 10px;">
<sc-for list="{{tones}}" as="t" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px;">
<label for="msg" style="font-size: 15px; line-height: 22px; font-weight: 700;">نص الرسالة</label>
<textarea id="msg" class="md-input" value="{{body}}" onChange="{{edit}}" rows="9" style="min-height: 250px; font-size: 16px; line-height: 27px; padding: 14px 16px; resize: none;"></textarea>
<div style="display: flex; justify-content: space-between; align-items: center;">
<span style="font-size: 13px; line-height: 20px; color: var(--ink-muted);">{{lines}} أسطر · الحد 5</span>
<button type="button" onClick="{{regen}}" class="md-btn md-btn-ghost md-btn-sm" style="padding: 0 8px;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"></path></svg>
<span>أعد الصياغة</span>
</button>
</div>
</div>
</main>

<footer style="display: flex; gap: 8px; padding: 12px 16px 20px; background: var(--surface-raised); border-top: 1px solid var(--line);">
<button type="button" class="md-btn md-btn-secondary" aria-label="نسخ الرسالة">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h10v11H9zM5 15V4h10"></path></svg>
<span>نسخ</span>
</button>
<a href="SentConfirm.dc.html" class="md-btn md-btn-whatsapp" style="text-decoration: none; flex-grow: 1;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5l1.4-3.6A8 8 0 1 1 8.2 18.7L4 19.5z"></path></svg>
<span>إرسال عبر واتساب</span>
</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.drafts = {
      friendly: 'السلام عليكم أستاذ خالد، معك أحمد، زرتكم اليوم في مطعم ريدان.\nلاحظت أن أطباقكم شكلها ممتاز، لكن حسابكم في إنستقرام بدون أي فيديو لها.\nعندي فكرة ريل قصير كل أسبوع يوصل المطعم لسكان الحي.\nيناسبك أرسل لك عينة مجانية من تصويري اليوم؟',
      formal: 'السلام عليكم أستاذ خالد، معك أحمد، مسوّق ومصوّر محتوى في الحمدانية، وتشرفت بزيارة مطعم ريدان اليوم.\nلفتني مستوى تقديم الأطباق، ولاحظت أن حساب المطعم في إنستقرام لا يعرضها بالفيديو.\nأقترح ريلز أسبوعية قصيرة تعرّف سكان الحي بالمطعم.\nهل تسمح لي بإرسال عينة مجانية من تصوير اليوم؟',
      short: 'السلام عليكم أستاذ خالد، معك أحمد من زيارة اليوم لمطعم ريدان.\nأطباقكم ممتازة وحسابكم بدون فيديو لها.\nأرسل لك عينة ريل مجانية من تصويري اليوم؟'
    };
    this.state = { tone: 'friendly', body: this.drafts.friendly };
  }
  renderVals() {
    var self = this, s = this.state;
    var seg = 'min-height: 44px; border: 0; border-radius: 7px; font: inherit; font-size: 15px; cursor: pointer; ';
    return {
      tones: [['friendly', 'ودّي'], ['formal', 'رسمي'], ['short', 'مختصر']].map(function (t) {
        var on = s.tone === t[0];
        return { label: t[1], checked: on ? 'true' : 'false', pick: function () { self.setState({ tone: t[0], body: self.drafts[t[0]] }); },
          style: seg + (on ? 'background: var(--surface-raised); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-card);' : 'background: transparent; color: var(--ink-muted); font-weight: 400;') };
      }),
      body: s.body,
      lines: s.body.split('\n').filter(function (l) { return l.trim(); }).length,
      edit: function (e) { self.setState({ body: e.target.value }); },
      regen: function () { self.setState({ body: self.drafts[s.tone] }); }
    };
  }
}
</script>
</body>
</html>
