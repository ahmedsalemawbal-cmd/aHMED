<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Pipeline — الداشبورد</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/maidani/tokens.css">
<link rel="stylesheet" href="ds/maidani/components/bundle.css">
<script src="ds/maidani/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="min-height: 1080px; display: flex; flex-wrap: wrap; align-items: stretch; background: var(--surface); color: var(--ink); font-family: var(--font-sans); direction: rtl;">
<div style="flex: 1 1 264px; max-width: 100%; display: flex; flex-direction: column;">
<dc-import name="DeskSidebar" active="pipeline" hint-size="100%,1080px"></dc-import>
</div>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 20px 40px; border-bottom: 1px solid var(--line); background: var(--surface-raised);">
<div style="flex-grow: 1; display: flex; flex-direction: column;">
<h1 style="margin: 0; font-size: 24px; line-height: 34px; font-weight: 700;">Pipeline</h1>
<span style="font-size: 14px; line-height: 22px; color: var(--ink-muted);">{{openCount}} صفقة مفتوحة · قيمة متوقعة <b style="color: var(--ink);">{{openValue}} ر.س</b> · اسحب البطاقة لتغيير مرحلتها</span>
</div>
<button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised); font: inherit; font-size: 14px; color: var(--ink); cursor: pointer;"><span style="color: var(--ink-muted);">النشاط:</span><b>الكل</b></button>
<a href="NewLead1.dc.html" class="md-btn md-btn-primary md-btn-sm" style="text-decoration: none;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span>عميل جديد</span>
</a>
</header>

<main style="flex-grow: 1; min-width: 0; overflow-x: auto; padding: 24px 40px 40px;">
<div style="display: flex; gap: 12px; align-items: flex-start; min-width: max-content;">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="7">
<section aria-label="{{c.label}}" onDragOver="{{c.over}}" onDrop="{{c.drop}}" style="{{c.style}}">
<div style="{{c.headStyle}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 700; color: {{c.color}};"><span style="width: 8px; height: 8px; border-radius: 999px; background: currentColor;"></span>{{c.label}}</span>
<span style="font-size: 13px; line-height: 20px; font-weight: 700; color: var(--ink);">{{c.count}}</span>
</div>
<span style="font-size: 13px; line-height: 20px; color: var(--ink-muted);">{{c.sum}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 120px;">
<sc-for list="{{c.cards}}" as="k" hint-placeholder-count="2">
<div draggable="true" onDragStart="{{k.drag}}" style="cursor: grab;">
<x-import component-from-global-scope="Maidani.LeadCard" variant="compact" business-name="{{k.name}}" activity="{{k.activity}}" value="{{k.value}}" days-in-stage="{{k.days}}" stale="{{k.stale}}"></x-import>
</div>
</sc-for>
</div>
</section>
</sc-for>
<button type="button" onClick="{{toggleLost}}" aria-expanded="{{lostOpen}}" style="flex: none; width: 56px; min-height: 240px; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 0; border: 1px dashed var(--line-strong); border-radius: 16px; background: transparent; font: inherit; color: var(--stage-lost); cursor: pointer;">
<span style="width: 8px; height: 8px; border-radius: 999px; background: currentColor;"></span>
<span style="writing-mode: vertical-rl; font-size: 14px; font-weight: 700;">خسارة · 6</span>
</button>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { lost: false, cards: [
      ['c1', 'not_visited', 'صيدلية النهدي فرع الحمدانية', 'صيدلية', 0, 0, false],
      ['c2', 'not_visited', 'مغسلة الحي', 'مغسلة', 0, 0, false],
      ['c3', 'visited', 'كافيه نسمة الحمدانية', 'كافيه', 1800, 4, false],
      ['c4', 'visited', 'مطعم الديرة', 'مطعم', 2200, 1, false],
      ['c5', 'contacted', 'مطعم ريدان', 'مطعم', 2500, 0, false],
      ['c6', 'contacted', 'مطعم بيت المندي', 'مطعم', 2000, 7, false],
      ['c7', 'contacted', 'مركز رواء لطب الأسنان', 'مركز أسنان', 4500, 3, false],
      ['c8', 'contacted', 'حلويات السنبلة', 'حلويات', 1500, 9, true],
      ['c9', 'replied', 'مجمع ابتسامة لطب الأسنان', 'مركز أسنان', 4000, 1, false],
      ['c10', 'meeting', 'مخبز الحي', 'مخبز', 1500, 2, false],
      ['c11', 'proposal', 'كوفي بلاك روز', 'كافيه', 2700, 3, false],
      ['c12', 'proposal', 'مطعم شاورما الركن', 'مطعم', 2000, 11, true],
      ['c13', 'won', 'كافيه سحابة', 'كافيه', 1900, 0, false]
    ] };
  }
  renderVals() {
    var self = this, s = this.state;
    var stages = [['not_visited', 'لم يُزر', 'stage-not-visited'], ['visited', 'تمت الزيارة', 'stage-visited'], ['contacted', 'تم الإرسال', 'stage-contacted'], ['replied', 'رد', 'stage-replied'], ['meeting', 'اجتماع', 'stage-meeting'], ['proposal', 'عرض سعر', 'stage-proposal'], ['won', 'تم الإغلاق', 'stage-won']];
    var fmt = function (n) { return n.toLocaleString('en-US'); };
    var openCount = 0, openValue = 0;
    var cols = stages.map(function (st) {
      var cards = s.cards.filter(function (c) { return c[1] === st[0]; });
      var sum = cards.reduce(function (a, c) { return a + c[4]; }, 0);
      if (st[0] !== 'won' && st[0] !== 'not_visited') { openCount += cards.length; openValue += sum; }
      return {
        label: st[1], color: 'var(--' + st[2] + ')', count: cards.length,
        sum: sum ? fmt(sum) + ' ر.س متوقعة' : 'بدون قيمة بعد',
        style: 'flex: none; width: 232px; display: flex; flex-direction: column; background: var(--surface-sunken); border-radius: 16px; overflow: hidden;',
        headStyle: 'display: flex; flex-direction: column; gap: 2px; padding: 12px 12px 10px; border-top: 4px solid var(--' + st[2] + '); background: var(--' + st[2] + '-soft);',
        over: function (e) { e.preventDefault(); },
        drop: function (e) { e.preventDefault(); var id = e.dataTransfer.getData('text/plain'); self.setState({ cards: self.state.cards.map(function (c) { return c[0] === id ? [c[0], st[0], c[2], c[3], c[4], 0, false] : c; }) }); },
        cards: cards.map(function (c) {
          return { name: c[2], activity: c[3], value: c[4] ? fmt(c[4]) + ' ر.س' : '—', days: c[5], stale: c[6],
            drag: function (e) { e.dataTransfer.setData('text/plain', c[0]); } };
        })
      };
    });
    return { cols: cols, openCount: openCount, openValue: fmt(openValue), lostOpen: s.lost ? 'true' : 'false', toggleLost: function () { self.setState({ lost: !s.lost }); } };
  }
}
</script>
</body>
</html>
