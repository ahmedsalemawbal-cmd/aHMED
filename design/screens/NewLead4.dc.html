<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>عميل جديد — الخدمات</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/maidani/tokens.css">
<link rel="stylesheet" href="ds/maidani/components/bundle.css">
<script src="ds/maidani/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans); direction: rtl;">

<header style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 12px; background: var(--surface-raised); border-bottom: 1px solid var(--line);">
<div style="display: flex; align-items: center; justify-content: space-between;">
<a href="NewLead3.dc.html" aria-label="رجوع" style="width: 48px; height: 48px; display: grid; place-items: center; color: var(--ink); margin-inline-start: -12px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<h1 style="margin: 0; font-size: 17px; line-height: 26px; font-weight: 700;">الخدمات المقترحة</h1>
<span style="font-size: 14px; line-height: 22px; color: var(--ink-muted); min-width: 36px; text-align: left;">4 من 4</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;" aria-hidden="true">
<span style="height: 4px; border-radius: 999px; background: var(--action);"></span>
<span style="height: 4px; border-radius: 999px; background: var(--action);"></span>
<span style="height: 4px; border-radius: 999px; background: var(--action);"></span>
<span style="height: 4px; border-radius: 999px; background: var(--action);"></span>
</div>
</header>

<main style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 20px 16px 24px;">
<p style="margin: 0; display: flex; gap: 10px; padding: 12px 14px; background: var(--surface-sunken); border-radius: 10px; font-size: 14px; line-height: 22px; color: var(--ink-muted);">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px;"><path d="M12 11v6M12 7.5v.5M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path></svg>
<span>اخترناها من نقاط ضعف التقييم ونشاط «مطعم». ألغِ أو أضف ما يناسب.</span>
</p>

<div role="group" aria-label="الخدمات" style="display: flex; flex-direction: column; gap: 10px;">
<sc-for list="{{services}}" as="s" hint-placeholder-count="4">
<button type="button" role="checkbox" aria-checked="{{s.checked}}" onClick="{{s.toggle}}" style="{{s.cardStyle}}">
<span style="{{s.boxStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{s.tickStyle}}"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; text-align: right;">
<span style="font-size: 16px; line-height: 24px; font-weight: 700; color: var(--ink);">{{s.name}}</span>
<span style="font-size: 13px; line-height: 20px; color: var(--ink-muted);">{{s.reason}}</span>
</span>
<span style="font-size: 13px; line-height: 20px; color: var(--ink-muted); white-space: nowrap; text-align: left;">{{s.price}}</span>
</button>
</sc-for>
</div>

<button type="button" class="md-btn md-btn-ghost md-btn-block" style="border: 1.5px dashed var(--line-strong);">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span>أضف خدمة من الكتالوج</span>
</button>

<x-import component-from-global-scope="Maidani.TextField" label="القيمة المتوقعة" ltr="{{yes}}" input-mode="numeric" default-value="2500" suffix="ر.س / شهرياً" hint="{{hint}}"></x-import>
</main>

<footer style="display: flex; gap: 8px; padding: 12px 16px 20px; background: var(--surface-raised); border-top: 1px solid var(--line);">
<a href="NewLead3.dc.html" class="md-btn md-btn-secondary" style="text-decoration: none;">السابق</a>
<a href="Message.dc.html" class="md-btn md-btn-primary" style="text-decoration: none; flex-grow: 1;">احفظ وولّد الرسالة</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { on: { video: true, maps: true, landing: true, ads: false } }; }
  renderVals() {
    var self = this, on = this.state.on;
    var defs = [
      ['video', 'تصوير وإنتاج فيديو وريلز', 'لأنه: لا ينشر فيديو أو ريلز', 'من [السعر] شهرياً'],
      ['maps', 'إدارة ملف خرائط قوقل والمراجعات', 'لأنه: لا يرد على المراجعات', 'من [السعر] شهرياً'],
      ['landing', 'صفحة هبوط للطلب', 'لأنه: بدون رابط طلب أو حجز', '[السعر] مرة واحدة'],
      ['ads', 'إدارة الحملات الإعلانية', 'لأنه: لا يعلن حالياً', 'من [السعر] شهرياً']
    ];
    var n = 0;
    var services = defs.map(function (d) {
      var c = !!on[d[0]]; if (c) n++;
      return { name: d[1], reason: d[2], price: d[3], checked: c ? 'true' : 'false',
        toggle: function () { var x = Object.assign({}, self.state.on); x[d[0]] = !c; self.setState({ on: x }); },
        cardStyle: 'display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 14px; border-radius: 16px; font: inherit; cursor: pointer; ' + (c ? 'background: var(--surface-raised); border: 2px solid var(--ink);' : 'background: var(--surface-raised); border: 1px solid var(--line); opacity: .85;'),
        boxStyle: 'width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; flex: none; box-sizing: border-box; ' + (c ? 'background: var(--action); color: var(--on-action);' : 'background: var(--surface-raised); border: 2px solid var(--line-strong); color: transparent;'),
        tickStyle: c ? 'display: block;' : 'display: none;' };
    });
    return { yes: true, services: services, hint: n + ' خدمات محددة · تدخل أول خدمتين في الرسالة' };
  }
}
</script>
</body>
</html>
