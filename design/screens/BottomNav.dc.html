<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الشريط السفلي</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/maidani/tokens.css">
<link rel="stylesheet" href="ds/maidani/components/bundle.css">
<script src="ds/maidani/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<nav aria-label="التنقل الرئيسي" style="width: 390px; height: 72px; box-sizing: border-box; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end; padding: 0 8px 8px; background: var(--surface-raised); border-top: 1px solid var(--line); font-family: var(--font-sans); direction: rtl;">
<sc-for list="{{left}}" as="item" hint-placeholder-count="2">
<a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.style}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
<span>{{item.label}}</span>
</a>
</sc-for>
<a href="NewLead1.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--ink); font-size: 12px; font-weight: 700; line-height: 16px;">
<span style="width: 56px; height: 56px; margin-top: -24px; border-radius: 999px; background: var(--action); color: var(--on-action); display: grid; place-items: center; box-shadow: var(--shadow-float); border: 4px solid var(--surface-raised);">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</span>
<span>عميل جديد</span>
</a>
<sc-for list="{{right}}" as="item" hint-placeholder-count="2">
<a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.style}}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d}}"></path></svg>
<span>{{item.label}}</span>
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["today","leads","pipeline","more"],"default":"today"},"$preview":{"width":390,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'today';
    var base = 'display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; min-height: 56px; text-decoration: none; font-size: 12px; line-height: 16px; ';
    function item(id, label, href, d) {
      var on = id === active;
      return { id: id, label: label, href: href, d: d, current: on ? 'page' : 'false',
        style: base + (on ? 'color: var(--ink); font-weight: 700;' : 'color: var(--ink-muted); font-weight: 400;') };
    }
    return {
      left: [
        item('today', 'اليوم', 'Main.dc.html', 'M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z'),
        item('leads', 'العملاء', 'Leads.dc.html', 'M4 9.5V20h16V9.5M3 4h18l-1.5 5.5a2.7 2.7 0 0 1-5.2 0 2.7 2.7 0 0 1-5.1 0 2.7 2.7 0 0 1-5.2 0L3 4z')
      ],
      right: [
        item('pipeline', 'Pipeline', 'Pipeline.dc.html', 'M4 4h4v16H4zM10 4h4v11h-4zM16 4h4v7h-4z'),
        item('more', 'المزيد', 'Settings.dc.html', 'M5 12h.01M12 12h.01M19 12h.01')
      ]
    };
  }
}
</script>
</body>
</html>
