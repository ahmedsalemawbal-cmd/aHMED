<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>العملاء — الداشبورد</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/maidani/tokens.css">
<link rel="stylesheet" href="ds/maidani/components/bundle.css">
<script src="ds/maidani/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="min-height: 1000px; display: flex; flex-wrap: wrap; align-items: stretch; background: var(--surface); color: var(--ink); font-family: var(--font-sans); direction: rtl;">
<div style="flex: 1 1 264px; max-width: 100%; display: flex; flex-direction: column;">
<dc-import name="DeskSidebar" active="leads" hint-size="100%,1000px"></dc-import>
</div>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column;">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 20px 40px; border-bottom: 1px solid var(--line); background: var(--surface-raised);">
<h1 style="margin: 0; flex-grow: 1; font-size: 24px; line-height: 34px; font-weight: 700;">العملاء <span style="font-size: 16px; font-weight: 400; color: var(--ink-muted);">47</span></h1>
<a href="NewLead1.dc.html" class="md-btn md-btn-primary md-btn-sm" style="text-decoration: none;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
<span>عميل جديد</span>
</a>
</header>

<main style="width: 100%; box-sizing: border-box; padding: 24px 40px 48px; display: flex; flex-direction: column; gap: 16px;">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
<label style="position: relative; display: block; flex: 0 1 320px; min-width: 220px;">
<span style="position: absolute; inset-inline-start: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); display: flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg></span>
<input type="search" aria-label="بحث بالاسم أو الرقم" placeholder="ابحث باسم المحل أو الجوال" class="md-input" style="min-height: 40px; font-size: 15px; padding-inline-start: 38px;">
</label>
<sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
<button type="button" style="display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface-raised); font: inherit; font-size: 14px; color: var(--ink); cursor: pointer;">
<span style="color: var(--ink-muted);">{{f.label}}:</span><b>{{f.value}}</b>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</sc-for>
</div>

<sc-if value="{{hasSel}}" hint-placeholder-val="{{yes}}">
<div role="region" aria-label="إجراءات على المحدد" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; background: var(--ink); color: var(--surface-raised); border-radius: 10px; font-size: 14px;">
<b style="flex-grow: 1;">{{selCount}} عملاء محددون</b>
<button type="button" style="min-height: 36px; padding: 0 12px; border: 1.5px solid var(--surface-raised); border-radius: 8px; background: transparent; color: var(--surface-raised); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">تغيير المرحلة</button>
<button type="button" style="min-height: 36px; padding: 0 12px; border: 1.5px solid var(--surface-raised); border-radius: 8px; background: transparent; color: var(--surface-raised); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;">تصدير CSV</button>
<button type="button" onClick="{{clearSel}}" style="min-height: 36px; padding: 0 8px; border: 0; background: transparent; color: var(--surface-raised); font: inherit; font-size: 14px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer;">إلغاء التحديد</button>
</div>
</sc-if>

<div style="overflow-x: auto; background: var(--surface-raised); border: 1px solid var(--line); border-radius: 16px;">
<table style="width: 100%; min-width: 980px; border-collapse: collapse; font-size: 14px; line-height: 22px;">
<thead>
<tr style="text-align: right; color: var(--ink-muted); font-size: 13px; background: var(--surface);">
<th scope="col" style="width: 48px; padding: 0 16px;"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">تحديد</span></th>
<th scope="col" style="padding: 12px; font-weight: 700;">المحل</th>
<th scope="col" style="padding: 12px; font-weight: 700;">المرحلة</th>
<th scope="col" aria-sort="{{scoreSort}}" style="padding: 0 12px; font-weight: 700;"><button type="button" onClick="{{toggleSort}}" style="display: flex; align-items: center; gap: 4px; min-height: 44px; padding: 0; border: 0; background: none; font: inherit; font-weight: 700; color: var(--ink); cursor: pointer;">الدرجة <span aria-hidden="true">{{sortArrow}}</span></button></th>
<th scope="col" style="padding: 12px; font-weight: 700;">الأولوية</th>
<th scope="col" style="padding: 12px; font-weight: 700;">آخر تواصل</th>
<th scope="col" style="padding: 12px; font-weight: 700;">الإجراء القادم</th>
<th scope="col" style="padding: 12px 20px; font-weight: 700; text-align: left;">القيمة المتوقعة</th>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<tr style="{{r.rowStyle}}">
<td style="padding: 0 16px;"><input type="checkbox" checked="{{r.sel}}" onChange="{{r.toggle}}" aria-label="{{r.selLabel}}" style="width: 20px; height: 20px; accent-color: var(--action); cursor: pointer;"></td>
<td style="padding: 12px;"><a href="DeskLead.dc.html" style="font-weight: 700; font-size: 15px; color: var(--ink); text-decoration: none;">{{r.name}}</a><div style="font-size: 13px; color: var(--ink-muted);">{{r.activity}} · {{r.contact}}</div></td>
<td style="padding: 12px;"><x-import component-from-global-scope="Maidani.StageBadge" stage="{{r.stage}}" size="sm"></x-import></td>
<td style="padding: 12px;"><div style="display: flex; align-items: center; gap: 8px;"><b style="min-width: 22px;">{{r.score}}</b><span style="width: 56px; height: 6px; border-radius: 999px; background: var(--surface-sunken); display: block; overflow: hidden;"><span style="{{r.scoreBar}}"></span></span></div></td>
<td style="padding: 12px;"><x-import component-from-global-scope="Maidani.PriorityBadge" priority="{{r.priority}}" size="sm"></x-import></td>
<td style="padding: 12px; color: var(--ink-muted); white-space: nowrap;">{{r.last}}</td>
<td style="padding: 12px;"><div style="font-weight: 700;">{{r.next}}</div><div style="{{r.atStyle}}">{{r.at}}</div></td>
<td style="padding: 12px 20px; text-align: left; font-weight: 700; white-space: nowrap;">{{r.value}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--ink-muted);">
<span>عرض 1–10 من 47</span>
<div style="display: flex; gap: 8px;">
<button type="button" class="md-btn md-btn-secondary md-btn-sm" disabled="">السابق</button>
<button type="button" class="md-btn md-btn-secondary md-btn-sm">التالي</button>
</div>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { sel: { r2: true, r5: true, r9: true }, asc: false }; }
  renderVals() {
    var self = this, s = this.state;
    var data = [
      ['r1', 'كافيه نسمة الحمدانية', 'كافيه', 'أ. سارة', 'visited', 58, 'warm', 'قبل 4 أيام', 'أرسل الرسالة الأولى', 'متأخرة منذ يومين', true, '1,800 ر.س'],
      ['r2', 'مطعم ريدان', 'مطعم', 'أ. خالد', 'contacted', 48, 'hot', 'اليوم 11:20 ص', 'متابعة أولى', 'السبت 10 أكتوبر', false, '2,500 ر.س'],
      ['r3', 'مجمع ابتسامة لطب الأسنان', 'مركز أسنان', 'د. ريم', 'replied', 44, 'hot', 'أمس', 'حدد اجتماعاً', 'اليوم', false, '4,000 ر.س'],
      ['r4', 'مخبز الحي', 'مخبز', 'أ. ماجد', 'meeting', 63, 'warm', 'قبل يومين', 'اجتماع في المحل', 'الخميس 4:30 م', false, '1,500 ر.س'],
      ['r5', 'مطعم بيت المندي', 'مطعم', 'أ. فهد', 'contacted', 52, 'warm', 'قبل 7 أيام', 'متابعة ثانية', 'اليوم', false, '2,000 ر.س'],
      ['r6', 'كوفي بلاك روز', 'كافيه', 'أ. نواف', 'proposal', 39, 'hot', 'قبل 3 أيام', 'تابع رد العرض', 'الجمعة 9 أكتوبر', false, '2,700 ر.س'],
      ['r7', 'مركز رواء لطب الأسنان', 'مركز أسنان', 'د. نوف', 'contacted', 41, 'warm', 'قبل 3 أيام', 'متابعة أولى', 'اليوم 4:00 م', false, '4,500 ر.س'],
      ['r8', 'مطعم الديرة', 'مطعم', 'أ. سلمان', 'visited', 55, 'warm', 'أمس', 'أرسل ريل العينة', 'اليوم 6:00 م', false, '2,200 ر.س'],
      ['r9', 'حلويات السنبلة', 'حلويات', 'أ. هند', 'contacted', 72, 'cold', 'قبل 9 أيام', 'تأجيل 30 يوماً؟', 'متأخرة منذ يوم', true, '1,500 ر.س'],
      ['r10', 'كافيه سحابة', 'كافيه', 'أ. عبدالله', 'won', 47, 'hot', 'قبل 5 أيام', 'تسليم أول ريل', 'الأحد 11 أكتوبر', false, '1,900 ر.س']
    ];
    if (s.asc !== null) data = data.slice().sort(function (a, b) { return s.asc ? a[5] - b[5] : 0; });
    var level = function (n) { return n < 50 ? 'var(--priority-hot)' : n < 70 ? 'var(--priority-warm)' : 'var(--priority-cold)'; };
    var count = Object.keys(s.sel).filter(function (k) { return s.sel[k]; }).length;
    return {
      yes: true,
      filters: [{ label: 'المرحلة', value: 'الكل' }, { label: 'النشاط', value: 'الكل' }, { label: 'الأولوية', value: 'الكل' }, { label: 'المصدر', value: 'زيارة' }],
      hasSel: count > 0, selCount: count,
      clearSel: function () { self.setState({ sel: {} }); },
      toggleSort: function () { self.setState({ asc: !s.asc }); },
      scoreSort: s.asc ? 'ascending' : 'none', sortArrow: s.asc ? '↑' : '↕',
      rows: data.map(function (d) {
        var on = !!s.sel[d[0]];
        return { name: d[1], activity: d[2], contact: d[3], stage: d[4], score: d[5], priority: d[6], last: d[7], next: d[8], at: d[9], value: d[11],
          sel: on, selLabel: 'تحديد ' + d[1],
          toggle: function () { var n = Object.assign({}, self.state.sel); n[d[0]] = !on; self.setState({ sel: n }); },
          rowStyle: 'border-top: 1px solid var(--line);' + (on ? ' background: var(--surface-sunken);' : ''),
          scoreBar: 'display: block; height: 100%; width: ' + d[5] + '%; background: ' + level(d[5]) + ';',
          atStyle: 'font-size: 13px; ' + (d[10] ? 'color: var(--warning); font-weight: 700;' : 'color: var(--ink-muted);') };
      })
    };
  }
}
</script>
</body>
</html>
