<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>عميل جديد — التقييم</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/maidani/tokens.css">
<link rel="stylesheet" href="ds/maidani/components/bundle.css">
<script src="ds/maidani/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans); direction: rtl;">

<header style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 16px; background: var(--surface-raised); border-bottom: 1px solid var(--line);">
<div style="display: flex; align-items: center; justify-content: space-between;">
<a href="NewLead1.dc.html" aria-label="رجوع" style="width: 48px; height: 48px; display: grid; place-items: center; color: var(--ink); margin-inline-start: -12px;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<h1 style="margin: 0; font-size: 17px; line-height: 26px; font-weight: 700;">تقييم مطعم ريدان</h1>
<span style="font-size: 14px; line-height: 22px; color: var(--ink-muted); min-width: 36px; text-align: left;">2 من 4</span>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;" aria-hidden="true">
<span style="height: 4px; border-radius: 999px; background: var(--action);"></span>
<span style="height: 4px; border-radius: 999px; background: var(--action);"></span>
<span style="height: 4px; border-radius: 999px; background: var(--surface-sunken);"></span>
<span style="height: 4px; border-radius: 999px; background: var(--surface-sunken);"></span>
</div>
<x-import component-from-global-scope="Maidani.ScoreBar" score="{{score}}" label="{{answeredLabel}}"></x-import>
</header>

<main style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 28px; padding: 20px 16px 24px;">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<section style="display: flex; flex-direction: column; gap: 20px;">
<h2 style="margin: 0; font-size: 13px; line-height: 20px; font-weight: 700; color: var(--ink-muted);">{{g.title}}</h2>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<x-import component-from-global-scope="Maidani.TriSelect" label="{{it.label}}" weight="{{it.weight}}" value="{{it.value}}" on-change="{{it.onChange}}" binary="{{it.binary}}" name="{{it.id}}"></x-import>
</sc-for>
</section>
</sc-for>
</main>

<footer style="display: flex; gap: 8px; padding: 12px 16px 20px; background: var(--surface-raised); border-top: 1px solid var(--line);">
<a href="NewLead1.dc.html" class="md-btn md-btn-secondary" style="text-decoration: none;">السابق</a>
<a href="NewLead3.dc.html" class="md-btn md-btn-primary" style="text-decoration: none; flex-grow: 1;">التالي: الملاحظات</a>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { a: {
      g1: 'yes', g2: 'partial', g3: 'no', g4: 'partial', s1: 'partial', s2: 'yes', s3: 'no', s4: 'partial',
      ad: 'no', web: 'no', wa: 'yes', shop: 'yes', off: 'no', r1: 'yes', r2: null, r3: null } };
  }
  renderVals() {
    var self = this, a = this.state.a;
    var defs = [
      ['خرائط قوقل', [['g1', 'التقييم 4.3 أو أعلى', 10], ['g2', 'عدد مراجعات كافٍ مقارنة بالمنافسين', 5], ['g3', 'يرد على المراجعات', 5], ['g4', 'صور حديثة ومعلومات مكتملة', 5]]],
      ['السوشيال ميديا', [['s1', 'حساب نشط، آخر نشر خلال 14 يوماً', 10], ['s2', 'جودة التصوير والمحتوى', 10], ['s3', 'ينشر فيديو أو ريلز', 10], ['s4', 'هوية بصرية موحدة', 5]]],
      ['الإعلانات والموقع والواتساب', [['ad', 'يعلن حالياً إعلانات مدفوعة', 10], ['web', 'موقع أو صفحة هبوط أو رابط طلب وحجز', 10], ['wa', 'واتساب أعمال برد سريع', 5]]],
      ['داخل المحل', [['shop', 'لوحة وهوية واضحة، ومنيو مصوّر', 10], ['off', 'عروض أو برنامج ولاء', 5]]],
      ['بنود خاصة بالمطاعم · لا تدخل في الدرجة', [['r1', 'صور احترافية للأطباق', null], ['r2', 'حضور في تطبيقات التوصيل', null], ['r3', 'منيو QR', null]]]
    ];
    var score = 0, answered = 0, total = 0;
    var groups = defs.map(function (g) {
      return { title: g[0], items: g[1].map(function (d) {
        var v = a[d[0]];
        if (d[2] != null) { total++; if (v) answered++; score += v === 'yes' ? d[2] : v === 'partial' ? d[2] / 2 : 0; }
        return { id: d[0], label: d[1], weight: d[2], binary: d[2] == null, value: v,
          onChange: function (nv) { var n = Object.assign({}, self.state.a); n[d[0]] = nv; self.setState({ a: n }); } };
      }) };
    });
    return { groups: groups, score: Math.round(score), answeredLabel: 'الدرجة · ' + answered + ' من ' + total + ' بنود' };
  }
}
</script>
</body>
</html>
