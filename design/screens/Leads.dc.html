<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قائمة العملاء</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/maidani/tokens.css">
<link rel="stylesheet" href="ds/maidani/components/bundle.css">
<script src="ds/maidani/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface); color: var(--ink); font-family: var(--font-sans); direction: rtl;">

<header style="display: flex; flex-direction: column; gap: 12px; padding: 24px 16px 12px; background: var(--surface);">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<h1 style="margin: 0; font-size: 24px; line-height: 34px; font-weight: 700;">العملاء <span style="font-size: 16px; font-weight: 400; color: var(--ink-muted);">47</span></h1>
</div>
<label style="position: relative; display: block;">
<span style="position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); color: var(--ink-muted); display: flex;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg>
</span>
<input type="search" aria-label="بحث بالاسم أو الرقم" placeholder="ابحث باسم المحل أو الجوال" class="md-input" style="padding-inline-start: 44px;">
</label>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 2px;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}} <span style="font-weight: 400; opacity: .8;">{{c.count}}</span></button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 14px; line-height: 22px; color: var(--ink-muted);">
<span>{{shown}} عملاء</span>
<button type="button" style="display: flex; align-items: center; gap: 4px; min-height: 44px; border: 0; background: none; font: inherit; font-size: 14px; color: var(--ink); font-weight: 700; cursor: pointer;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"></path></svg>
ترتيب: الإجراء القادم
</button>
</div>
</header>

<main style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 0 16px 24px;">
<sc-for list="{{leads}}" as="l" hint-placeholder-count="4">
<x-import component-from-global-scope="Maidani.LeadCard" business-name="{{l.name}}" activity="{{l.activity}}" contact-name="{{l.contact}}" stage="{{l.stage}}" score="{{l.score}}" priority="{{l.priority}}" last-contact="{{l.last}}" next-action="{{l.next}}" next-action-at="{{l.at}}" overdue="{{l.overdue}}" on-whats-app="{{l.wa}}" on-click="{{l.open}}"></x-import>
</sc-for>
</main>
<dc-import name="BottomNav" active="leads" hint-size="390px,72px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: 'all' }; }
  renderVals() {
    var self = this, f = this.state.f, noop = function () {};
    var all = [
      { name: 'كافيه نسمة الحمدانية', activity: 'كافيه', contact: 'أ. سارة', stage: 'visited', score: 58, priority: 'warm', last: 'قبل 4 أيام', next: 'أرسل الرسالة الأولى', at: 'متأخرة منذ يومين', overdue: true, wa: noop },
      { name: 'مطعم ريدان', activity: 'مطعم', contact: 'أ. خالد', stage: 'contacted', score: 48, priority: 'hot', last: 'اليوم 11:20 ص', next: 'متابعة أولى: عينة الريل', at: 'السبت 10 أكتوبر', overdue: false, wa: noop },
      { name: 'مجمع ابتسامة لطب الأسنان', activity: 'مركز أسنان', contact: 'د. ريم', stage: 'replied', score: 44, priority: 'hot', last: 'أمس', next: 'حدد اجتماعاً', at: 'اليوم', overdue: false, wa: noop },
      { name: 'مخبز الحي', activity: 'مخبز', contact: 'أ. ماجد', stage: 'meeting', score: 63, priority: 'warm', last: 'قبل يومين', next: 'اجتماع في المحل', at: 'الخميس 8 أكتوبر · 4:30 م', overdue: false, wa: noop },
      { name: 'مطعم بيت المندي', activity: 'مطعم', contact: 'أ. فهد', stage: 'contacted', score: 52, priority: 'warm', last: 'قبل 7 أيام', next: 'متابعة ثانية وأخيرة', at: 'اليوم', overdue: false, wa: noop },
      { name: 'كوفي بلاك روز', activity: 'كافيه', contact: 'أ. نواف', stage: 'proposal', score: 39, priority: 'hot', last: 'قبل 3 أيام', next: 'تابع رد العرض', at: 'الجمعة 9 أكتوبر', overdue: false, wa: noop }
    ];
    var chipDefs = [['all', 'الكل', 47], ['visited', 'تمت الزيارة', 9], ['contacted', 'تم الإرسال', 12], ['replied', 'رد', 5], ['meeting', 'اجتماع', 3], ['proposal', 'عرض سعر', 4]];
    var chip = 'flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; ';
    var leads = all.filter(function (l) { return f === 'all' || l.stage === f; }).map(function (l) { return Object.assign({ open: noop }, l); });
    return {
      chips: chipDefs.map(function (c) {
        var on = f === c[0];
        return { label: c[1], count: c[2], pressed: on ? 'true' : 'false', pick: function () { self.setState({ f: c[0] }); },
          style: chip + (on ? 'background: var(--ink); color: var(--surface-raised); border: 1.5px solid var(--ink); font-weight: 700;' : 'background: var(--surface-raised); color: var(--ink); border: 1.5px solid var(--line-strong); font-weight: 700;') };
      }),
      leads: leads,
      shown: f === 'all' ? 47 : leads.length
    };
  }
}
</script>
</body>
</html>
